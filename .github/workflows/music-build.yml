name: Custom Music test build

# Builds a ready-to-run WheelWizard.exe from the music branch so it can be tested without installing the .NET SDK.
# Download it from the run's "Artifacts" section on the Actions tab.

on:
  push:
    branches:
      - music
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Build WheelWizard.exe (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WheelWizard.sln

      - name: Build solution
        run: dotnet build WheelWizard.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime win-x64
          --configuration Release
          --output publish/win-x64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Upload WheelWizard.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WheelWizard-music-windows-x64
          path: publish/win-x64/WheelWizard.exe
          retention-days: 30

      # Runs after the upload so a failing test elsewhere never blocks getting the exe to try out.
      - name: Run tests
        run: dotnet test WheelWizard.sln --configuration Release --no-build --verbosity normal
